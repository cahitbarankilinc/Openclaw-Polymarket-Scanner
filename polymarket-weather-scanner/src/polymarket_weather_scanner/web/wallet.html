<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wallet Detail</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page">
      <a class="back-link" href="/">← Listeye dön</a>
      <header class="hero wallet-hero">
        <div>
          <p class="eyebrow">Wallet detail</p>
          <h1 id="walletTitle">Wallet</h1>
          <p class="muted address" id="walletAddress"></p>
        </div>
      </header>

      <section class="cards" id="walletSummary"></section>

      <section class="panel detail-panel">
        <h2>5 cent bucket detayları</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Bucket</th>
                <th>Win rate</th>
                <th>Won</th>
                <th>Lost</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody id="detailBody"></tbody>
          </table>
        </div>
      </section>
    </div>
    <script src="/wallet.js" defer></script>
  </body>
</html>
