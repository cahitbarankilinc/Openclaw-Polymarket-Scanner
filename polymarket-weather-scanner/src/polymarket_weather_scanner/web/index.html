<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polymarket Weather Scanner</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div>
          <p class="eyebrow">Local frontend</p>
          <h1>Polymarket Weather Scanner</h1>
          <p class="muted">Wallet listesi + kategori bazlı görünüm + win-rate bucket analizi.</p>
        </div>
        <div class="refresh-area">
          <button id="refreshButton">Yenile</button>
          <span id="refreshProgress" class="muted refresh-progress"></span>
        </div>
      </header>

      <section class="cards" id="summaryCards"></section>

      <div class="main-layout">
        <aside class="panel category-sidebar">
          <div class="category-sidebar-header">
            <h2>Kategoriler</h2>
            <p class="muted">Favs + leaderboard kategorileri + custom walletlar.</p>
          </div>
          <div class="add-wallet-box">
            <label for="walletAddressInput">Wallet ekle</label>
            <input id="walletAddressInput" type="text" placeholder="0x..." autocomplete="off" />
            <button id="addWalletButton" type="button">Analyze et</button>
            <div id="addWalletStatus" class="muted add-wallet-status"></div>
          </div>
          <nav id="categoryList" class="category-list"></nav>
        </aside>

        <main class="content-area">
          <section class="panel filters">
            <div class="field">
              <label for="searchInput">Ara</label>
              <input id="searchInput" type="search" placeholder="username / address / source" />
            </div>
            <div class="field small">
              <label for="qualifiedOnly">Durum</label>
              <select id="qualifiedOnly">
                <option value="all">Hepsi</option>
                <option value="qualified">Sadece qualified</option>
                <option value="rejected">Sadece rejected</option>
              </select>
            </div>
            <div class="field small">
              <label for="sortSelect">Sırala</label>
              <select id="sortSelect">
                <option value="win_rate">Genel win rate</option>
                <option value="weather_trade_ratio">Weather ratio</option>
                <option value="pnl">PnL</option>
                <option value="distinct_markets_traded">Markets</option>
              </select>
            </div>
          </section>

          <section class="panel bucket-filters">
            <div class="bucket-filters-header">
              <div>
                <h2>Bucket filtreleri</h2>
                <p class="muted">Her aralık için activity (toplam sample) ve win rate min/max gir. Boş bırakırsan filtre uygulanmaz.</p>
              </div>
              <button id="resetBucketFilters" type="button" class="secondary-button">Bucket filtrelerini temizle</button>
            </div>
            <div id="bucketFiltersGrid" class="bucket-filters-grid"></div>
          </section>

          <section class="wallet-list" id="walletList"></section>
        </main>
      </div>
    </div>

    <template id="summaryCardTemplate">
      <article class="panel stat-card">
        <span class="muted stat-label"></span>
        <strong class="stat-value"></strong>
      </article>
    </template>

    <script src="/app.js" defer></script>
  </body>
</html>
